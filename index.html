<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Order</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #fffaf6;
        color: #302a27;
      }

      /* Navbar */
      nav {
        width: 100%;
        min-height: 75px;
        padding: 15px 35px;
        background: #ffffff;
        display: flex;
        font-size: larger;
        font-weight: 800;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 18px #4a28150d;
        position: sticky;
        top: 0;
        z-index: 5;
      }

      nav h2 {
        color: #df603d;
        letter-spacing: -1px;
      }

      #carticon {
        font-size: 27px;
        color: white;
        background: #df603d;
        padding: 12px;
        border-radius: 14px;
        cursor: pointer;
        transition: 0.3s;
      }

      #carticon:hover {
        background: #bd4528;
        transform: scale(1.08);
      }

      /* Buttons container */
      .btn {
        width: 100%;
        height: auto;
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #fff;
        border-top: 1px solid #f0e2d9;
      }

      /* Cart sidebar */
      #menu {
        width: 350px;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 0;
        position: fixed;
        left: -350px;
        top: 0;
        background: #fffaf6;
        box-shadow: 8px 0 35px #00000018;
        z-index: 10;
        transition: left 0.3s ease;
      }

      #menu h2 {
        background: #ffe5d9;
        color: #bc4a2c;
        width: 100%;
        padding: 24px 20px;
        text-align: center;
        font-size: 24px;
        border-bottom: 1px solid #f2d2c3;
      }

      #items {
        width: 100%;
        flex: 1;
        overflow-y: auto;
        padding: 10px 15px;
      }

      #total,
      #close {
        flex: 1;
        border: none;
        padding: 14px 8px;
        font-size: 15px;
        font-weight: 800;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.25s;
      }

      #total {
        background: #df603d;
        color: white;
      }

      #total:hover {
        background: #bd4528;
        transform: translateY(-2px);
      }

      #close {
        background: #f2e7e0;
        color: #624b40;
      }

      #close:hover {
        background: #e6d4c9;
      }

      .show {
        left: 0 !important;
      }

      /* Food cards container */
      .food-container {
        width: 100%;
        min-height: calc(100vh - 75px);
        padding: 45px 25px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 28px;
      }

      /* Food card */
      .food-card {
        width: 310px;
        height: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 17px;
        background: #ffffff;
        border: 1px solid #f0e0d7;
        border-radius: 23px;
        box-shadow: 0 7px 25px #522e1a0a;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .food-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 35px #522e1a17;
        border-color: #edb8a4;
      }

      .food-card img {
        border-radius: 16px;
        width: 100%;
        height: 190px;
        object-fit: cover;
        background: #fff0e8;
      }

      .food-card h2 {
        font-size: 23px;
        color: #302a27;
        text-align: center;
      }

      .food-card p {
        color: #df603d;
        font-weight: 700;
        font-size: 19px;
      }

      .food-card button {
        width: 150px;
        height: 42px;
        border-radius: 12px;
        cursor: pointer;
        background: #302a27;
        color: white;
        border: none;
        font-size: 15px;
        font-weight: 700;
        transition: 0.25s;
      }

      .food-card button:hover {
        background: #df603d;
        transform: scale(1.04);
      }

      /* Cart items */
      .cart-item {
        width: 100%;
        min-height: 80px;
        padding: 12px 5px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #eadbd2;
      }

      .cart-item img {
        border-radius: 12px;
        width: 48px;
        height: 48px;
        object-fit: cover;
      }

      .cart-item h6 {
        max-width: 105px;
        font-size: 12px;
        color: #302a27;
      }

      .cart-item p {
        font-size: 13px;
        font-weight: 700;
        color: #df603d;
      }

      .cart-item button {
        width: 27px;
        height: 27px;
        border-radius: 9px;
        cursor: pointer;
        background: #f9e6dc;
        color: #bc4527;
        border: none;
        font-size: 17px;
        font-weight: 800;
        transition: 0.2s;
      }

      .cart-item button:hover {
        background: #df603d;
        color: white;
      }

      /* Mobile */
      @media (max-width: 600px) {
        nav {
          padding: 13px 18px;
        }

        nav h2 {
          font-size: 23px;
        }

        .food-container {
          padding: 25px 15px;
          gap: 20px;
        }

        .food-card {
          width: min(100%, 350px);
        }

        #menu {
          width: 350px;
          max-width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <h2><i class="ri-restaurant-2-line"></i> Food Order</h2>
      <i class="ri-shopping-cart-line" id="carticon"></i>
    </nav>

    <div id="menu">
      <h2>Cart Menu</h2>
      <div id="items"></div>
      <div class="btn">
        <button id="total">Total</button>
        <button id="close">Close</button>
      </div>
    </div>

    <script>
      let items = document.getElementById("items");
      let menu = document.getElementById("menu");
      let total = document.getElementById("total");

      let close = document
        .getElementById("close")
        .addEventListener("click", () => {
          menu.classList.remove("show");
        });

      let carticon = document
        .getElementById("carticon")
        .addEventListener("click", () => {
          menu.classList.toggle("show");
        });

      let menuarr = [];

      let food = [
        {
          id: 1,
          name: "Chicken Biryani",
          price: 220,
          image:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTLETHygJZ1iGyBd7EUjwLwTLqVqBbWrtHBL1FpyvRz9j4_4aXa0_CbLs&s=10",
        },
        {
          id: 2,
          name: "Pizza",
          price: 350,
          image:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuZIjsDhYOgdgJEdnyArLYiBJAatEytVZYHPvMVzdpvw&s=10",
        },
        {
          id: 3,
          name: "Burger",
          price: 180,
          image:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJfR_efLTTioIeId2ZChDAaDaJ7H5Khs6Su3md7_NQZQ&s=10",
        },
        {
          id: 4,
          name: "French Fries",
          price: 120,
          image:
            "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500",
        },
        {
          id: 5,
          name: "Sandwich",
          price: 150,
          image:
            "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500",
        },
        {
          id: 6,
          name: "Pasta",
          price: 250,
          image:
            "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500",
        },
        {
          id: 7,
          name: "Fried Chicken",
          price: 280,
          image:
            "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500",
        },
        {
          id: 8,
          name: "Chocolate Cake",
          price: 180,
          image:
            "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500",
        },
        {
          id: 9,
          name: "Ice Cream",
          price: 100,
          image:
            "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500",
        },
        {
          id: 10,
          name: "Veg Fried Rice",
          price: 160,
          image:
            "https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=500",
        },
        {
          id: 11,
          name: "Dosa",
          price: 80,
          image:
            "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500",
        },
        {
          id: 13,
          name: "Chicken Noodles",
          price: 200,
          image:
            "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?w=500",
        },
      ];

      let par = document.createElement("div");
      par.className = "food-container";
      document.body.append(par);

      function foodui(item) {
        par.innerHTML = "";

        if (item.length === 0) {
          par.innerHTML = "No food found";
          return;
        }

        item.forEach((f) => {
          let div = document.createElement("div");
          div.className = "food-card";
          par.append(div);

          let p1 = document.createElement("p");
          p1.innerHTML = "Id : " + f.id;

          let img1 = document.createElement("img");
          img1.src = f.image;
          img1.alt = f.name;

          let h1 = document.createElement("h2");
          h1.innerHTML = f.name;

          let btn = document.createElement("button");
          btn.innerHTML = '<i class="ri-add-line"></i> Add';

          btn.addEventListener("click", () => {
            let exist = menuarr.find((z) => z.id === f.id);

            if (exist) {
              alert("Food is in the menulist !!!");
            } else {
              menuarr.push({
                id: f.id,
                name: f.name,
                image: f.image,
                price: f.price,
                q: 1,
              });
            }

            menuui();
          });

          let p2 = document.createElement("p");
          p2.innerHTML = "Price : " + f.price;

          div.append(img1, h1, p2, btn);
        });
      }

      foodui(food);

      let sum, gst, totalamnt;

      function menuui() {
        items.innerHTML = "";

        menuarr.forEach((i) => {
          let menudiv = document.createElement("div");
          menudiv.className = "cart-item";
          items.append(menudiv);

          let img11 = document.createElement("img");
          img11.src = i.image;
          img11.alt = i.name;

          let h11 = document.createElement("h6");
          h11.innerHTML = i.name;

          let btn1 = document.createElement("button");
          btn1.innerHTML = "-";

          btn1.addEventListener("click", () => {
            i.q--;

            if (i.q <= 0) {
              menuarr = menuarr.filter((o) => o.id !== i.id);
            }

            menuui();
          });

          let btn2 = document.createElement("button");
          btn2.innerHTML = "+";

          btn2.addEventListener("click", () => {
            i.q++;
            menuui();
          });

          let p1 = document.createElement("p");
          p1.innerHTML = i.price;

          let p2 = document.createElement("p");
          p2.innerHTML = i.q;

          let p3 = document.createElement("p");
          p3.innerHTML = i.price * i.q;

          menudiv.append(img11, h11, p1, btn1, p2, btn2, p3);
        });

        sum = menuarr.reduce((total, item) => {
          return total + item.price * item.q;
        }, 0);

        gst = sum * (18 / 100).toFixed(2);
        totalamnt = sum + gst;
        total.innerHTML = "Total : " + totalamnt;
      }

      total.addEventListener("click", () => {
        alert(`Bill calculation is : [Food : ${sum}],[GST : ${gst}]`);
      });
    </script>
  </body>
</html>
